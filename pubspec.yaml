publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.6
  syncfusion_flutter_pdf: ^27.1.48
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

